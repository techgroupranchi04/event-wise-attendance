<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event-wise Check-in Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#18212f;
  --muted:#687386;
  --border:#e4e8ef;
  --primary:#e90000;
  --primary-soft:#fff0f0;
  --shadow:0 10px 30px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{max-width:1400px;margin:0 auto;padding:32px 24px 48px}
.header{margin-bottom:24px}
.eyebrow{
  color:var(--primary);font-size:12px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px
}
h1{margin:0;font-size:30px;line-height:1.15}
.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}
.controls{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:18px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:1.4fr .8fr auto;gap:14px;align-items:end;
  margin-bottom:20px;
}
.field label{
  display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px
}
select,button{
  width:100%;height:44px;border:1px solid var(--border);
  border-radius:10px;background:#fff;padding:0 12px;font:inherit;color:var(--text)
}
button{
  width:auto;padding:0 18px;background:var(--primary);border-color:var(--primary);
  color:#fff;font-weight:700;cursor:pointer
}
button:hover{filter:brightness(.94)}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px
}
.stat{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:18px;box-shadow:var(--shadow)
}
.stat-label{font-size:12px;color:var(--muted);font-weight:700}
.stat-value{font-size:28px;font-weight:800;margin-top:6px}
.chart-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:22px;box-shadow:var(--shadow)
}
.chart-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:16px}
.chart-title{font-size:18px;font-weight:800;margin:0}
.chart-note{font-size:12px;color:var(--muted);margin-top:5px}
.chart-wrap{height:620px;position:relative}
.table-wrap{margin-top:20px;overflow:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}
th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{background:#fafbfc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td:last-child,th:last-child{text-align:right}
tr:last-child td{border-bottom:0}
.badge{
  display:inline-flex;padding:5px 8px;border-radius:999px;
  background:var(--primary-soft);color:var(--primary);font-weight:800
}
.empty{
  height:300px;display:grid;place-items:center;color:var(--muted);
  font-size:14px
}
@media(max-width:800px){
  .container{padding:20px 14px}
  h1{font-size:24px}
  .controls{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .chart-wrap{height:520px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="eyebrow">Festival Check-in Analytics</div>
    <h1>Event-wise Check-ins by Date</h1>
    <p class="subtitle">Compare actual check-ins for each scheduled event, with venue and date filters.</p>
  </div>

  <div class="controls">
    <div class="field">
      <label for="venue">Venue</label>
      <select id="venue"></select>
    </div>
    <div class="field">
      <label for="date">Date</label>
      <select id="date">
        <option value="all">All dates</option>
        <option value="14-Aug-2026">14 Aug 2026</option>
        <option value="15-Aug-2026">15 Aug 2026</option>
        <option value="16-Aug-2026">16 Aug 2026</option>
      </select>
    </div>
    <button id="reset">Reset filters</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Events shown</div><div class="stat-value" id="eventCount">0</div></div>
    <div class="stat"><div class="stat-label">Total check-ins</div><div class="stat-value" id="checkinTotal">0</div></div>
    <div class="stat"><div class="stat-label">Highest event check-in</div><div class="stat-value" id="maxCheckin">0</div></div>
  </div>

  <div class="chart-card">
    <div class="chart-head">
      <div>
        <p class="chart-title" id="chartTitle">Event-wise check-ins</p>
        <div class="chart-note" id="chartNote"></div>
      </div>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <canvas id="checkinChart"></canvas>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Venue</th>
            <th>Event</th>
            <th>Scheduled time</th>
            <th>Check-ins</th>
          </tr>
        </thead>
        <tbody id="dataTable"></tbody>
      </table>
    </div>
  </div>
</div>

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function filteredData() {
  const venue = venueSelect.value;
  const date = dateSelect.value;

  return DATA.filter(row =>
    (venue === "all" || row.venue === venue) &&
    (date === "all" || row.date === date)
  );
}

function shortDate(date) {
  return date.replace("-2026", "");
}

  const rows = filteredData();

  // Sort chronologically by date, then scheduled time.
  rows.sort((a,b) => {
    const da = new Date(a.date.replace(/-/g," "));
    const db = new Date(b.date.replace(/-/g," "));
    if (da - db !== 0) return da - db;
    return a.scheduled.localeCompare(b.scheduled);
  });

  const total = rows.reduce((sum,r) => sum + r.checkins, 0);
  const max = rows.length ? Math.max(...rows.map(r => r.checkins)) : 0;

  eventCount.textContent = rows.length.toLocaleString();
  checkinTotal.textContent = total.toLocaleString();
  maxCheckin.textContent = max.toLocaleString();

  const venueText = venueSelect.value === "all" ? "All event venues" : venueSelect.value;
  const dateText = dateSelect.value === "all" ? "All festival dates" : dateSelect.value;

  chartTitle.textContent = `${venueText} — event check-ins`;
  chartNote.textContent = `${dateText} • ${rows.length} event slot${rows.length === 1 ? "" : "s"}`;

  tableBody.innerHTML = rows.length
    ? rows.map(r => `
      <tr>
        <td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.venue)}</td>
        <td>${escapeHtml(r.event)}</td>
        <td>${escapeHtml(r.scheduled)}</td>
        <td><span class="badge">${r.checkins}</span></td>
      </tr>
    `).join("")
    : `<tr><td colspan="5"><div class="empty">No event data for the selected filters.</div></td></tr>`;

  // Horizontal bars keep long film/event names readable.
  chartWrap.style.height = Math.max(420, rows.length * 48 + 120) + "px";

  if (chart) chart.destroy();

  const labels = rows.map(r =>
    dateSelect.value === "all"
      ? `${shortDate(r.date)} • ${r.event}`
      : r.event
  );

  chart = new Chart(document.getElementById("checkinChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Check-ins",
        data: rows.map(r => r.checkins),
        borderRadius: 7,
        borderSkipped: false,
        backgroundColor: "rgba(233, 0, 0, 0.82)",
        hoverBackgroundColor: "rgba(233, 0, 0, 1)"
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => rows[items[0].dataIndex].event,
            afterTitle: items => {
              const r = rows[items[0].dataIndex];
              return `${r.date} • ${r.venue}`;
            },
            label: item => ` Check-ins: ${item.raw}`
          }
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          title: { display: true, text: "Check-ins" },
          ticks: { precision: 0 },
          grid: { color: "rgba(100,110,130,.12)" }
        },
        y: {
          grid: { display: false },
          ticks: {
            autoSkip: false,
            font: { size: 11 }
          }
        }
      }
    }
  });
}

venueSelect.addEventListener("change", render);
dateSelect.addEventListener("change", render);
resetBtn.addEventListener("click", () => {
  venueSelect.value = "all";
  dateSelect.value = "all";
  render();
});

init();
</script>
</body>
</html>
